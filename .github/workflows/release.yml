name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag whose release should be created or updated
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22.x"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Run tsc
        run: pnpm tsc

      - name: Run lint
        run: pnpm lint

      - name: Run test
        run: pnpm test

      - name: Build plugin
        run: |
          pnpm run build

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber main.js manifest.json styles.css
          else
            gh release create "$tag" \
              --title="$tag" \
              main.js manifest.json styles.css
          fi
